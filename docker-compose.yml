# ═══════════════════════════════════════════════════════
#  docker-compose.yml — 肺栓塞 RAG 系统部署
# 包含: 后端 API + Next.js 前端 + Gradio 前端（可选）
# ═══════════════════════════════════════════════════════

name: pe-rag-system

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - "8001:8000"
    volumes:
      # bind mount: 改源码只需 restart 不用 rebuild
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
      # 复用本地 HuggingFace 模型缓存，避免每次部署重新下载
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); assert r.status==200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8001
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Gradio 前端（可选，与 Next.js 二选一或并存）
  gradio:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gradio
    ports:
      - "7860:7860"
    volumes:
      - ./gradio_app.py:/app/gradio_app.py:ro
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - gradio  # 默认不启动: docker compose --profile gradio up -d
