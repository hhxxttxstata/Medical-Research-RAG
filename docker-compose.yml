# ═══════════════════════════════════════════════════════
#  docker-compose.yml — 肺栓塞 RAG 系统部署
# ═══════════════════════════════════════════════════════
#
# 使用方式:
#   1. 复制 .env，填入 LLM API Key（DeepSeek 推荐）
#   2. docker compose up -d
#   3. 打开 http://localhost:7860
#
# 访问:
#   前端 Gradio: http://localhost:7860
#   后端 API:    http://localhost:8000 (Swagger: /docs)
# ═══════════════════════════════════════════════════════

name: pe-rag-system

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      # ponytail: 源码文件用 bind mount 覆盖，改代码后只需 restart，不用 rebuild
      - ./app.py:/app/app.py:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - API_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); assert r.status==200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    ports:
      - "7860:7860"
    volumes:
      - ./gradio_app.py:/app/gradio_app.py:ro
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
