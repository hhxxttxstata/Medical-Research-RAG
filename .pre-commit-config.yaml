repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy 停用：pre-commit 隔离环境缺 torch/nibabel 等 stub，与本地（.venv）结果不一致。
  # 类型检查统一在本地执行：.venv/Scripts/python.exe -m mypy src/ app.py main.py
