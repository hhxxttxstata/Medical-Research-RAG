name: Eval Full（手动/夜间全量验收：qualify --full 含 safety + regression）

on:
  workflow_dispatch:
    inputs:
      run_regression:
        description: "qualify --full 通过后是否继续跑 regression 对比基线"
        type: boolean
        default: true
  schedule:
    # 夜间全量回归（P0-6）：UTC 22:00 = 北京时间每日 06:00，跑在 main 最新提交上。
    # 夜间失败不阻塞任何 PR，仅留报告供晋升核对与漂移监控。
    - cron: "0 22 * * *"

# issue #4 ⑤⑥⑦ + handoff v2 P0-6：晋升前一键验收与夜间漂移监控。
# 需重建索引（Milvus Lite）+ DeepSeek API，串行独占约 40-90 分钟。
# 任何 Exit Criteria / safety gate 不达标或指标降级 → FAIL。
jobs:
  eval-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MILVUS_LITE: "true"
      HF_HUB_OFFLINE: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Secret 防呆
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "❌ 缺少 secret DEEPSEEK_API_KEY（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-embedding-reranker

      - name: 重建索引（Milvus Lite）
        run: python scripts/rebuild_index.py

      - name: Qualify --full（Exit Criteria + safety 门禁）
        run: python scripts/qualify.py --full

      # schedule 触发时无 inputs（恒跑）；手动触发按开关决定
      - name: Regression（对比基线，指标降级即 FAIL）
        if: github.event_name == 'schedule' || inputs.run_regression
        run: python scripts/regression.py

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: eval_results/
          retention-days: 30
