name: Trivy Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # 大镜像（torch+marker ~10GB）解压导出会撑爆 runner /tmp（~14GB），先释放预装软件
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
      - name: Build Docker image
        run: docker build -t pe-rag-backend -f Dockerfile.backend .
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pe-rag-backend
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m
