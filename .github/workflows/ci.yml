name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.18
      - name: Lint check
        run: ruff check .
      - name: Format check
        run: ruff format --check . --exclude data

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install mypy
        run: pip install mypy types-requests
      - name: Type check
        run: mypy --config-file pyproject.toml src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        # 全量跑完不看中途失败（issue #4：不允许 -x 截断失败清单）；
        # 覆盖率棘轮门禁 46% = 当前实测 48% - 2%，只升不降
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=46

  qualify-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Audit bad cases registry（①收集：登记表 schema 校验）
        run: python scripts/audit_bad_cases.py
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Qualification rules gate（bad case 规则断言，无需索引/LLM）
        run: python scripts/qualify.py --rules

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build（含 tsc 类型检查）
        run: pnpm build

  docker:
    needs: [lint, type-check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pe-rag-backend -f Dockerfile.backend .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pe-rag-backend
          format: table
          exit-code: 1
          severity: CRITICAL
