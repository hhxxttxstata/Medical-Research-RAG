[project]
name = "pe-rag-system"
version = "2.0.0"
description = "Pulmonary Embolism Research Literature RAG Q&A System"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "scripts/archive/",
    "docs/archive/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904", "E741", "SIM105", "SIM115", "UP007"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["N806", "F841", "E402", "SIM108", "B007", "I001", "UP038"]
"eval/*" = ["B905", "B007", "F841", "UP038"]
"tests/*" = ["F841"]
"src/generator.py" = ["E402", "F841"]
"src/document_processor.py" = ["SIM102", "SIM108"]
"src/rag_pipeline.py" = ["SIM115"]
"src/retriever.py" = ["B905"]
"src/text_splitter.py" = ["SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "eval/",
    "build/",
]
